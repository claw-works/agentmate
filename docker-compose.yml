services:
  postgres:
    image: postgres:16-alpine
    container_name: agentmate-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentmate_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-agentmate}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: agentmate-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "${DATABASE_URL_MIGRATE:-postgres://agentmate:agentmate_secret_2026@postgres:5432/agentmate?sslmode=disable}",
        "up"
      ]
    restart: on-failure

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentmate-server
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${SERVER_PORT:-26001}:${SERVER_PORT:-26001}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      GIN_MODE: ${GIN_MODE:-debug}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://agentmate:agentmate_secret_2026@postgres:5432/agentmate?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-agentmate_jwt_secret_2026}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      SERVER_PORT: ${SERVER_PORT:-26001}
      QDRANT_URL: ${QDRANT_URL_DOCKER:-http://host.docker.internal:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-agentmate_retrieval}
      QDRANT_VECTOR_NAME: ${QDRANT_VECTOR_NAME:-semantic}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_ENCODING_FORMAT: ${EMBEDDING_ENCODING_FORMAT:-float}
      CHEAP_LLM_BASE_URL: ${CHEAP_LLM_BASE_URL:-https://api.deepseek.com}
      CHEAP_LLM_CHAT_COMPLETIONS_URL: ${CHEAP_LLM_CHAT_COMPLETIONS_URL:-https://api.deepseek.com/chat/completions}
      CHEAP_LLM_API_KEY: ${CHEAP_LLM_API_KEY:-}
      CHEAP_LLM_MODEL: ${CHEAP_LLM_MODEL:-deepseek-v4-flash}
      # Wiki compiler and reviewer (K3). These are forwarded explicitly because the
      # environment block is an allowlist: a variable absent here is simply invisible
      # to the container, so the Go defaults silently win and the operator's .env has
      # no effect. Each falls back to the embedding credential, which is how a
      # single-credential deployment works, and reviewer_independence then reports
      # same_provider honestly rather than claiming independence it does not have.
      COMPILER_BASE_URL: ${COMPILER_BASE_URL:-}
      COMPILER_API_KEY: ${COMPILER_API_KEY:-}
      COMPILER_MODEL: ${COMPILER_MODEL:-}
      COMPILER_TEMPERATURE: ${COMPILER_TEMPERATURE:-}
      COMPILER_MAX_TOKENS: ${COMPILER_MAX_TOKENS:-}
      COMPILER_TIMEOUT_SECONDS: ${COMPILER_TIMEOUT_SECONDS:-}
      COMPILER_INPUT_MICROS_PER_1K_TOKENS: ${COMPILER_INPUT_MICROS_PER_1K_TOKENS:-}
      COMPILER_OUTPUT_MICROS_PER_1K_TOKENS: ${COMPILER_OUTPUT_MICROS_PER_1K_TOKENS:-}
      REVIEWER_BASE_URL: ${REVIEWER_BASE_URL:-}
      REVIEWER_API_KEY: ${REVIEWER_API_KEY:-}
      REVIEWER_MODEL: ${REVIEWER_MODEL:-}
      REVIEWER_TEMPERATURE: ${REVIEWER_TEMPERATURE:-}
      REVIEWER_MAX_TOKENS: ${REVIEWER_MAX_TOKENS:-}
      REVIEWER_TIMEOUT_SECONDS: ${REVIEWER_TIMEOUT_SECONDS:-}
      REVIEWER_INPUT_MICROS_PER_1K_TOKENS: ${REVIEWER_INPUT_MICROS_PER_1K_TOKENS:-}
      REVIEWER_OUTPUT_MICROS_PER_1K_TOKENS: ${REVIEWER_OUTPUT_MICROS_PER_1K_TOKENS:-}
      # Wiki compile queue (K3.3).
      WIKI_WORKER_CONCURRENCY: ${WIKI_WORKER_CONCURRENCY:-}
      WIKI_WORKER_POLL_SECONDS: ${WIKI_WORKER_POLL_SECONDS:-}
      WIKI_WORKER_HEARTBEAT_SECONDS: ${WIKI_WORKER_HEARTBEAT_SECONDS:-}
      WIKI_WORKER_RETRY_BACKOFF_SECONDS: ${WIKI_WORKER_RETRY_BACKOFF_SECONDS:-}
      WIKI_WORKER_MAX_RETRY_BACKOFF_SECONDS: ${WIKI_WORKER_MAX_RETRY_BACKOFF_SECONDS:-}
    restart: unless-stopped

volumes:
  postgres_data:
